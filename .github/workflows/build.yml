name: Build Note 9 Kernel (2886 MHz)

on:
  workflow_dispatch:
  push:
    branches: [ems]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf libelf-dev libncurses5-dev libssl-dev libxml2 libxml2-utils lz4 python3 python-is-python3 unzip zip

      - name: Download AOSP Clang 20 (r547379)
        run: |
          mkdir -p clang
          curl -sL https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz | tar -xz -C clang

      - name: Compile Image.gz and DTBs
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export ANDROID_MAJOR_VERSION=q
          export PLATFORM_VERSION=10
          ls -la arch/arm64/configs/*crown* arch/arm64/configs/*exynos9810* 2>/dev/null || true
          MAKE_ARGS="O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          if [ -f arch/arm64/configs/exynos9810-crownlte_defconfig ]; then
            make $MAKE_ARGS exynos9810-crownlte_defconfig
          elif [ -f arch/arm64/configs/crownlte_defconfig ] && [ -f arch/arm64/configs/exynos9810.config ]; then
            make $MAKE_ARGS crownlte_defconfig exynos9810.config
          else
            make $MAKE_ARGS crownlte_defconfig
          fi
          ./scripts/config --file out/.config --set-str LITTLE_CPU_MASK "0-3" --set-str BIG_CPU_MASK "4-7" --disable ICE
          make $MAKE_ARGS olddefconfig
          grep -q "CONFIG_ICE=y" out/.config && echo "ERROR: CONFIG_ICE still enabled!" && exit 1 || echo "OK: CONFIG_ICE disabled"
          make -j$(nproc) $MAKE_ARGS Image.gz dtbs

      - name: Package Artifacts
        run: |
          mkdir -p release
          cp out/arch/arm64/boot/Image.gz release/
          cp out/arch/arm64/boot/dts/exynos/exynos9810-crownlte_eur_open_26.dtb release/ 2>/dev/null || true

      - name: Upload Image.gz & DTB
        uses: actions/upload-artifact@v4
        with:
          name: crownlte-2886mhz-kernel
          path: release/
